name: CI

on:
   pull_request:
   push:
      branches: [main]

permissions:
   contents: read

jobs:
   lint:
      runs-on: ubuntu-latest
      steps:
         - uses: actions/checkout@v6

         - uses: oven-sh/setup-bun@v2
           with:
              bun-version: latest

         - run: bun ci
         - run: bun run lint

   format:
      runs-on: ubuntu-latest
      steps:
         - uses: actions/checkout@v6

         - uses: oven-sh/setup-bun@v2
           with:
              bun-version: latest

         - run: bun ci
         - run: bun run fmt:check
