name: CI

on:
  pull_request:
  push:
    branches: ["*"]

# pushing over an open PR cancels its in-flight run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Bun version is auto-detected from package.json "packageManager"
      - uses: oven-sh/setup-bun@v2

      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun ci
      - run: bun run fmt:check
      - run: bun run lint
      - run: bun run test

  docker:
    name: Docker sanity check
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          build-args: NEXT_PUBLIC_MUSEUM=ash
          tags: odp-ash:${{ github.sha }}
          cache-from: type=gha,scope=odp-ci
          cache-to: type=gha,scope=odp-ci,mode=max
