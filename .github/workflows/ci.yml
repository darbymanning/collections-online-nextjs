name: CI

on:
  pull_request:
  push:
    branches: ["*"]

# pushing over an open PR cancels its in-flight run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun ci
      - run: bun run fmt:check
      - run: bun run lint
      - run: bun run test

  docker:
    name: Docker sanity check
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          build-args: NEXT_PUBLIC_MUSEUM=ash
          tags: odp-ash:${{ github.sha }}
          cache-from: type=gha,scope=odp-ci
          cache-to: type=gha,scope=odp-ci,mode=max

  e2e:
    name: E2E (${{ matrix.museum }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        museum: [ash, oum, prm, hsm]
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: playwright-${{ runner.os }}-

      # chromium only, no --with-deps: ubuntu-latest already ships its system libraries
      - run: bunx playwright install chromium

      - run: bun run test:e2e
        env:
          E2E_MUSEUMS: ${{ matrix.museum }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.museum }}
          path: playwright-report/
          retention-days: 7
