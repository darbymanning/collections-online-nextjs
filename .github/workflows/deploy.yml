name: Bake image and deploy service

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, test]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Bake and deploy Ashmolean
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
      ECS_SERVICE: ${{ secrets.ECS_SERVICE }}
      ECR_REPOSITORY_URI_STUB: ${{ secrets.ECR_REPOSITORY_URI_STUB }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set image tag
        id: image
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "tag=${HEAD_SHA::8}" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          aws ecr --region "$AWS_REGION" get-login-password | docker login \
            --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: NEXT_PUBLIC_MUSEUM=ash
          tags: ${{ env.ECR_REPOSITORY_URI_STUB }}-ash:${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=odp
          cache-to: type=gha,scope=odp,mode=max

      - name: Render task definition
        id: render-task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          task-definition-family: odp-ash
          container-name: odp
          image: ${{ env.ECR_REPOSITORY_URI_STUB }}-ash:${{ steps.image.outputs.tag }}
          environment-variables: |
            NEXT_PUBLIC_MUSEUM=ash
            BASIC_AUTH_USER=colodp
            BASIC_AUTH_PASS=tryN8xt!
          log-configuration-log-driver: awslogs
          log-configuration-options: |
            awslogs-create-group=true
            awslogs-group=/ecs/test-odp-ash
            awslogs-region=${{ env.AWS_REGION }}
            awslogs-stream-prefix=ecs
      - name: Register task definition
        run: |
          aws ecs register-task-definition \
            --cli-input-json "file://${{ steps.render-task.outputs.task-definition }}"

      # - name: Deploy to ECS
      #   uses: aws-actions/amazon-ecs-deploy-task-definition@v2
      #   with:
      #     task-definition: ${{ steps.render-task.outputs.task-definition }}
      #     service: ${{ env.ECS_SERVICE }}
      #     cluster: ${{ env.ECS_CLUSTER }}
      #     wait-for-service-stability: true
