name: Bake image and deploy service

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, test]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Bake and deploy ${{ matrix.museum }}
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        museum: [ash, oum, prm, hsm]
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
      ECS_SERVICE_STUB: ${{ secrets.ECS_SERVICE_STUB }}
      ECR_REPOSITORY_URI_STUB: ${{ secrets.ECR_REPOSITORY_URI_STUB }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set image tag
        id: image
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "tag=${HEAD_SHA::8}" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          aws ecr --region "$AWS_REGION" get-login-password | docker login \
            --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: NEXT_PUBLIC_MUSEUM=${{ matrix.museum }}
          tags: ${{ env.ECR_REPOSITORY_URI_STUB }}-${{ matrix.museum }}:${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=odp-${{ matrix.museum }}
          cache-to: type=gha,scope=odp-${{ matrix.museum }},mode=max

      - name: Render task definition
        id: render-task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition-${{ matrix.museum }}.json
          container-name: odp
          image: ${{ env.ECR_REPOSITORY_URI_STUB }}-${{ matrix.museum }}:${{ steps.image.outputs.tag }}
          environment-variables: |
            NEXT_PUBLIC_MUSEUM=${{ matrix.museum }}
            BASIC_AUTH_USER=colodp
            BASIC_AUTH_PASS=tryN8xt!
          log-configuration-log-driver: awslogs
          log-configuration-options: |
            awslogs-create-group=true
            awslogs-group=/ecs/test-odp-${{ matrix.museum }}
            awslogs-region=${{ env.AWS_REGION }}
            awslogs-stream-prefix=ecs

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE_STUB }}-${{ matrix.museum }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
