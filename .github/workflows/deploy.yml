name: Bake image and deploy service

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, test]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker:
    name: Docker images
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          build-args: NEXT_PUBLIC_MUSEUM=ash
          tags: odp-ash:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=odp

      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          build-args: NEXT_PUBLIC_MUSEUM=oum
          tags: odp-oum:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=odp

      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          build-args: NEXT_PUBLIC_MUSEUM=prm
          tags: odp-prm:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=odp

      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          build-args: NEXT_PUBLIC_MUSEUM=hsm
          tags: odp-hsm:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=odp
          cache-to: type=gha,scope=odp,mode=max
